<div class="card">
  <a href="{{ url_for('product', pid=p['id']) }}" class="card-img"><img src="{{ p['image'] }}" alt="{{ p['name'] }}" loading="lazy"></a>
  <div class="card-body">
    <div class="muted small">{{ p['category'] }} · ★ {{ p['rating'] }}</div>
    <a href="{{ url_for('product', pid=p['id']) }}" class="card-title">{{ p['name'] }}</a>
    <div class="card-row">
      <strong>${{ p['price'] }}</strong>
      <form method="post" action="{{ url_for('cart_add') }}">
        <input type="hidden" name="pid" value="{{ p['id'] }}">
        <button class="btn btn-sm">Add</button>
      </form>
    </div>
  </div>
</div>
